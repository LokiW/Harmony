plugins {
    id("java")
    id("com.gtnewhorizons.retrofuturagradle") version "1.4.9"
}

version = "1.0"
group = "com.harmony.harmonymod"
base { archivesName = "harmony" }

java {
    toolchain {
        // Minecraft 1.7.10 must be compiled and run with Java 8
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.AZUL
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

minecraft {
    mcVersion = "1.7.10"
    // Forge version defaults to 10.13.4.1614 for 1.7.10
    username = "Developer"
}

repositories {
    mavenCentral()
}

dependencies {
    // Put mod dependencies here, e.g.
    // implementation rfg.deobf("curse.maven:some-mod-12345:67890")
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", minecraft.mcVersion

    filesMatching("mcmod.info") {
        expand("version": project.version, "mcversion": minecraft.mcVersion.get())
    }
}

// Local test setup, see test.ps1
//   -Pplayer=Name      play as Name, with its own folder in run/players/ (default: Developer in run/)
//   -Pconnect=host:port  join that server on startup (port defaults to 25565)
tasks.named("runServer") {
    workingDir = file("run/server")
    doFirst { workingDir.mkdirs() }
}

tasks.named("runClient") {
    def player = findProperty("player")
    if (player) {
        username = player
        workingDir = file("run/players/${player}")
    }
    def connect = findProperty("connect")
    if (connect) {
        def (host, port) = (connect.contains(":") ? connect.split(":") : [connect, "25565"]) as List
        extraArgs.addAll("--server", host, "--port", port)
    }
    doFirst { workingDir.mkdirs() }
}
